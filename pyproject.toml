[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyawe"
version = "0.1.0"
description = "Python client library for the AWE (Advanced Workflow Engine) API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["awe", "workflow", "automation", "ullav"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "responses>=0.23",
    "ruff",
    "mypy",
    "types-requests",
]

[project.urls]
"Homepage" = "https://github.com/colinmanning/pyawe"
"Bug Tracker" = "https://github.com/colinmanning/pyawe/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyawe*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
